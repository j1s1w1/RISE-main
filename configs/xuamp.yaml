# RISE configuration for XUAMP.
#
# Controlled label noise is applied only to the predefined training split.
# Validation and test labels remain clean.
# Machine-specific filesystem paths are configured in paths.yaml.

schema_version: 2

experiment:
  name: rise_xuamp
  dataset: XUAMP
  noise_rates: [0.0, 0.1, 0.2, 0.3]
  repetitions: [1, 2, 3, 4, 5]

data:
  validation_mode: predefined
  noise_source: file
  require_train_files: true
  require_validation_files: true
  require_test_files: true

features:
  # Frozen ESM2 residue representations.
  esm_batch_size: 8

  # Residue graph construction.
  contact_threshold: 8.0
  graph_knn_k: 8

  # ESMFold residue-level pLDDT.
  plddt_scale: auto
  disable_plddt_feature: false

  index_pdb_by_seq: false
  allow_missing_pdb: false
  use_aa_onehot: true

cache:
  delete_after_run: false

model:
  # One-layer bidirectional LSTM.
  hidden_dim: 128
  lstm_layers: 1

  # Three-layer residual GraphSAGE encoder.
  gnn_hidden_dim: 128
  gnn_layers: 3

  classifier_hidden: 128
  dropout: 0.30

  # Dempster-Shafer evidential fusion.
  fusion_type: ds

neighborhood:
  # L2-normalized sequence and structure descriptors are concatenated
  # before cross-sample neighborhood construction.
  feature: dual
  knn_k: 20

loss:
  # Appendix A of the manuscript.
  lambda_aux: 0.05
  lambda_t_consistency: 0.05
  lambda_conf: 0.01
  lambda_mse: 1.0
  lambda_mix: 1.0

training:
  batch_size: 16
  eval_batch_size: 64
  num_workers: 0

  epochs: 100

  # RISE uses a five-epoch warm-up and performs supervision assessment
  # every five epochs. The five-epoch warm-up is fixed in train.py.
  start_correct: 5
  correct_every: 5

  patience: 40
  monitor: val_f1
  min_delta: 0.0001
  min_best_epoch: 1
  best_after_start_correct: true

  lr: 0.0003
  transition_lr: 0.001
  weight_decay: 0.0001
  clip_grad_norm: 1.0

  annealing_epoch: 80
  seed: 42

  log_every: 5
  log_every_extract: 500

calibration:
  # Neighborhood-based candidate-selection threshold.
  threshold: 0.80

  # No threshold decay is used in the reported experiments.
  threshold_decay: 1.0
  min_threshold: 0.60

  # Verified supervision is retained as a soft target.
  keep_soft_label: true

  # Representation interpolation used by L_mix.
  use_mixup: true
  mixup_alpha: 0.30
